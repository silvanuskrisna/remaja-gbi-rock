<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROCKET — GBI ROCK Banjarmasin</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0f0f1a; --card: #1a1a2e; --primary: #7c3aed;
  --primary-dim: #6d28d92a; --text: #e2e8f0; --muted: #94a3b8;
  --border: #1e293b; --success: #22c55e;
  --radius: 16px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 28px 24px; max-width: 420px; width: 100%;
  box-shadow: 0 8px 32px #00000040;
}

.logo {
  text-align: center; margin-bottom: 24px;
}
.logo .icon { font-size: 2.5rem; }
.logo h1 { font-size: 1.3rem; margin-top: 8px; }
.logo p { font-size: .8rem; color: var(--muted); margin-top: 4px; }
.logo .badge {
  display: inline-block; margin-top: 8px; padding: 4px 14px;
  background: var(--primary-dim); color: var(--primary);
  border-radius: 99px; font-size: .7rem; font-weight: 600;
}

.form-group { margin-bottom: 14px; }
.form-group label {
  display: block; font-size: .78rem; color: var(--muted); margin-bottom: 5px; font-weight: 500;
}
.form-group input {
  width: 100%; padding: 12px 14px; border-radius: 12px;
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  font-size: .9rem; transition: border .2s;
}
.form-group input:focus { outline: none; border-color: var(--primary); }
.form-group input::placeholder { color: #475569; }

.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }

select {
  width: 100%; padding: 12px 14px; border-radius: 12px;
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  font-size: .9rem;
}

.btn {
  width: 100%; padding: 14px; border: none; border-radius: 12px;
  background: var(--primary); color: #fff; font-size: 1rem;
  font-weight: 600; cursor: pointer; transition: all .2s;
  margin-top: 6px;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px #7c3aed60; }
.btn:active { transform: translateY(0); }

.pesan {
  text-align: center; margin-top: 16px; padding: 12px;
  border-radius: 10px; font-size: .85rem; display: none;
}
.pesan.sukses { display: block; background: #22c55e20; color: var(--success); border: 1px solid #22c55e40; }
.pesan.gagal { display: block; background: #ef444420; color: #ef4444; border: 1px solid #ef444440; }

.footer {
  text-align: center; margin-top: 20px; font-size: .7rem; color: var(--muted);
}

.info {
  background: var(--primary-dim); border-radius: 10px; padding: 10px 12px;
  margin-bottom: 16px; font-size: .78rem; color: var(--muted); line-height: 1.5;
  border-left: 3px solid var(--primary);
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="icon">🫂</div>
    <h1>ROCKET</h1>
    <p>GBI ROCK Banjarmasin</p>
    <div class="badge">🚀</div>
  </div>

  <div class="info">
    Silakan isi data diri lengkap di bawah ini untuk pendataan ROCKET.
  </div>

  <div class="form-group">
    <label>Nama Panggilan</label>
    <input id="fNickname" placeholder="Contoh: Ivan">
  </div>

  <div class="form-group">
    <label>Nama Lengkap</label>
    <input id="fName" placeholder="Nama lengkap kamu">
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>Tempat Lahir</label>
      <input id="fBirthPlace" placeholder="Banjarmasin">
    </div>
    <div class="form-group">
      <label>Tanggal Lahir</label>
      <input id="fBirthDate" type="date">
    </div>
  </div>

  <div class="form-group">
    <label>Sekolah</label>
    <input id="fSchool" placeholder="SMP N 1 Banjarmasin">
  </div>

  <div class="form-group">
    <label>No. WhatsApp</label>
    <input id="fWA" placeholder="08123456789" type="tel">
    <span style="font-size:.7rem;color:var(--muted);margin-top:4px;display:block">Nomor Pribadi atau No Orangtua</span>
  </div>

  <div class="form-group">
    <label>Kelas</label>
    <select id="fGrade">
      <option value="">— Pilih kelas —</option>
      <option value="7">Kelas 7</option>
      <option value="8">Kelas 8</option>
      <option value="9">Kelas 9</option>
    </select>
  </div>

  <button class="btn" onclick="simpan()">Daftar Sekarang</button>

  <div class="pesan" id="pesan"></div>

  <div class="footer">
    ⚡ Data disimpan aman & rahasia
  </div>
</div>

<script>
function simpan() {
  const nickname = document.getElementById('fNickname').value.trim();
  const name = document.getElementById('fName').value.trim();
  const birthPlace = document.getElementById('fBirthPlace').value.trim();
  const birthDate = document.getElementById('fBirthDate').value;
  const school = document.getElementById('fSchool').value.trim();
  const wa = document.getElementById('fWA').value.trim();
  const grade = document.getElementById('fGrade').value;

  if (!nickname) { tampilPesan('Nama panggilan diisi dulu ya!', false); return; }
  if (!name) { tampilPesan('Nama lengkap diisi dulu ya!', false); return; }
  if (!grade) { tampilPesan('Pilih kelas kamu dulu', false); return; }

  const entry = {
    nickname, name, birthPlace, birthDate, school, wa, grade,
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    createdAt: new Date().toISOString()
  };

  // Simpan ke localStorage dulu (nanti diganti pake Supabase)
  try {
    const data = JSON.parse(localStorage.getItem('gbirmj-pendaftaran')) || [];
    data.push(entry);
    localStorage.setItem('gbirmj-pendaftaran', JSON.stringify(data));
    tampilPesan('Terima kasih! Data kamu udah tersimpan 🙏', true);
    document.getElementById('fNickname').value = '';
    document.getElementById('fName').value = '';
    document.getElementById('fBirthPlace').value = '';
    document.getElementById('fBirthDate').value = '';
    document.getElementById('fSchool').value = '';
    document.getElementById('fWA').value = '';
    document.getElementById('fGrade').value = '';
  } catch(e) {
    tampilPesan('Maaf, ada error. Coba lagi ya!', false);
  }
}

function tampilPesan(msg, sukses) {
  const el = document.getElementById('pesan');
  el.textContent = msg;
  el.className = 'pesan ' + (sukses ? 'sukses' : 'gagal');
  el.style.display = 'block';
  if (sukses) {
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }
}
</script>
</body>
</html>
