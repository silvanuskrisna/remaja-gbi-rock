<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database Remaja GBI ROCK</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0f0f1a; --card: #1a1a2e; --primary: #7c3aed;
  --primary-dim: #6d28d92a; --accent: #f59e0b; --text: #e2e8f0;
  --muted: #94a3b8; --border: #1e293b; --danger: #ef4444; --success: #22c55e;
  --radius: 12px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  padding: 16px; max-width: 600px; margin: 0 auto; padding-bottom: 80px;
}
h1 { font-size: 1.4rem; margin-bottom: 4px; }
.sub { color: var(--muted); font-size: .8rem; margin-bottom: 16px; }

/* Stats */
.stats {
  display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
}
.stat {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 16px; flex: 1; min-width: 80px;
  text-align: center;
}
.stat .num { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
.stat .lbl { font-size: .65rem; color: var(--muted); }

/* Search + add */
.toolbar {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.search {
  flex: 1; padding: 10px 14px; border-radius: 10px;
  background: var(--card); color: var(--text); border: 1px solid var(--border);
  font-size: .85rem;
}
.btn {
  padding: 10px 16px; border-radius: 10px; border: none;
  cursor: pointer; font-size: .8rem; font-weight: 500;
  white-space: nowrap;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: .75rem; }
.btn-outline { background: transparent; color: var(--muted); border: 1px solid var(--border); }

/* Student card */
.std-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 8px;
}
.std-card .info { flex: 1; }
.std-card .name { font-size: .95rem; font-weight: 600; margin-bottom: 4px; }
.std-card .detail { font-size: .78rem; color: var(--muted); line-height: 1.4; }
.std-card .detail span { display: block; }
.std-card .actions { display: flex; gap: 4px; flex-shrink: 0; }

/* Empty state */
.empty {
  text-align: center; padding: 40px 20px; color: var(--muted); font-size: .85rem;
}

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: #000000aa; backdrop-filter: blur(4px);
  z-index: 100; justify-content: center; align-items: flex-end;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card); border-radius: var(--radius) var(--radius) 0 0;
  width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto;
  padding: 20px 16px 24px;
  animation: slideUp .25s ease;
}
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal h2 { font-size: 1.1rem; margin-bottom: 16px; }
.modal-close { float: right; background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; }

.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
.form-group input {
  width: 100%; padding: 10px 14px; border-radius: 10px;
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  font-size: .85rem;
}
.form-group input:focus { outline: none; border-color: var(--primary); }
.form-row { display: flex; gap: 8px; }
.form-row .form-group { flex: 1; }
.form-actions { display: flex; gap: 8px; margin-top: 16px; }
.form-actions button { flex: 1; }

/* Floating add button mobile */
.fab {
  position: fixed; bottom: 24px; right: 24px;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--primary); color: #fff; border: none;
  font-size: 1.8rem; cursor: pointer; box-shadow: 0 4px 12px #7c3aed60;
  display: flex; align-items: center; justify-content: center;
  z-index: 50;
}

/* Grade filter */
.grade-filters {
  display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;
}
.grade-filters button {
  padding: 5px 14px; border-radius: 99px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted); cursor: pointer; font-size: .75rem;
}
.grade-filters button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

@media (min-width: 600px) {
  .fab { display: none; }
}
</style>
</head>
<body>

<h1>📋 Database Remaja</h1>
<div class="sub">GBI ROCK — Pendataan remaja SMP</div>

<div class="stats">
  <div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">Total</div></div>
  <div class="stat"><div class="num" id="k7Count">0</div><div class="lbl">Kelas 7</div></div>
  <div class="stat"><div class="num" id="k8Count">0</div><div class="lbl">Kelas 8</div></div>
  <div class="stat"><div class="num" id="k9Count">0</div><div class="lbl">Kelas 9</div></div>
</div>

<div class="grade-filters" id="gradeFilters">
  <button class="active" onclick="filterGrade(0)">Semua</button>
  <button onclick="filterGrade(7)">Kelas 7</button>
  <button onclick="filterGrade(8)">Kelas 8</button>
  <button onclick="filterGrade(9)">Kelas 9</button>
</div>

<div class="toolbar">
  <input class="search" id="searchInput" placeholder="Cari nama..." oninput="renderList()">
</div>

<div id="studentList"></div>

<!-- FAB for mobile -->
<button class="fab" onclick="openAdd()">+</button>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">x</button>
    <h2 id="modalTitle">Tambah Remaja</h2>
    <div class="form-group">
      <label>Nama Lengkap</label>
      <input id="fName" placeholder="Nama lengkap">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Tempat Lahir</label>
        <input id="fBirthPlace" placeholder="Banjarmasin">
      </div>
      <div class="form-group">
        <label>Tanggal Lahir</label>
        <input id="fBirthDate" type="date">
      </div>
    </div>
    <div class="form-group">
      <label>Sekolah</label>
      <input id="fSchool" placeholder="SMP N 1 Banjarmasin">
    </div>
    <div class="form-group">
      <label>No. WhatsApp (remaja / ortu)</label>
      <input id="fWA" placeholder="08123456789" type="tel">
    </div>
    <div class="form-group">
      <label>Kelas</label>
      <select id="fGrade" style="width:100%;padding:10px;border-radius:10px;background:var(--bg);color:var(--text);border:1px solid var(--border);font-size:.85rem">
        <option value="7">Kelas 7</option>
        <option value="8">Kelas 8</option>
        <option value="9">Kelas 9</option>
      </select>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveStudent()">Simpan</button>
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'gbirmj-db';

function getData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
}

function getAge(birthDate) {
  if (!birthDate) return null;
  const today = new Date();
  const birth = new Date(birthDate);
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
  return age;
}

function getGradeLabel(grade) {
  return 'Kelas ' + grade;
}

let currentFilter = 0;
let editId = null;

function filterGrade(g) {
  currentFilter = g;
  document.querySelectorAll('#gradeFilters button').forEach((b, i) => {
    b.classList.toggle('active', i === g ? true : (g === 0 && i === 0));
  });
  // Fix: properly toggle
  document.querySelectorAll('#gradeFilters button').forEach((b) => b.classList.remove('active'));
  const btns = document.querySelectorAll('#gradeFilters button');
  if (g === 0) btns[0].classList.add('active');
  else if (g === 7) btns[1].classList.add('active');
  else if (g === 8) btns[2].classList.add('active');
  else if (g === 9) btns[3].classList.add('active');
  renderList();
}

function renderList() {
  const data = getData();
  const q = document.getElementById('searchInput').value.toLowerCase();
  const list = document.getElementById('studentList');

  let filtered = data;
  if (currentFilter > 0) {
    filtered = filtered.filter(s => parseInt(s.grade) === currentFilter);
  }
  if (q) {
    filtered = filtered.filter(s => s.name.toLowerCase().includes(q));
  }

  // Update stats
  document.getElementById('totalCount').textContent = data.length;
  document.getElementById('k7Count').textContent = data.filter(s => parseInt(s.grade) === 7).length;
  document.getElementById('k8Count').textContent = data.filter(s => parseInt(s.grade) === 8).length;
  document.getElementById('k9Count').textContent = data.filter(s => parseInt(s.grade) === 9).length;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">' +
      (q ? 'Gak ada hasil untuk "' + q + '"' : 'Belum ada data remaja. Klik + untuk nambah! 📝') +
      '</div>';
    return;
  }

  list.innerHTML = filtered.map(s => {
    const age = getAge(s.birthDate);
    const detailParts = [];
    if (s.birthPlace && s.birthDate) {
      detailParts.push(s.birthPlace + ', ' + new Date(s.birthDate).toLocaleDateString('id-ID', {day:'numeric',month:'long',year:'numeric'}));
    }
    if (s.school) detailParts.push('🏫 ' + s.school);
    if (s.wa) detailParts.push('📱 ' + s.wa);
    if (age !== null) detailParts.push('🎂 ' + age + ' tahun');

    return '<div class="std-card">' +
      '<div class="info">' +
        '<div class="name">' + escapeHtml(s.name) + '</div>' +
        '<div class="detail">' +
          '<span style="color:var(--accent);font-weight:500">' + getGradeLabel(s.grade) + '</span>' +
          detailParts.map(p => '<span>' + p + '</span>').join('') +
        '</div>' +
      '</div>' +
      '<div class="actions">' +
        '<button class="btn btn-sm btn-outline" onclick="openEdit(\'' + s.id + '\')">✏️</button>' +
        '<button class="btn btn-sm btn-danger" onclick="deleteStudent(\'' + s.id + '\')">🗑️</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function escapeHtml(t) {
  if (!t) return '';
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function openAdd() {
  editId = null;
  document.getElementById('modalTitle').textContent = 'Tambah Remaja';
  document.getElementById('fName').value = '';
  document.getElementById('fBirthPlace').value = '';
  document.getElementById('fBirthDate').value = '';
  document.getElementById('fSchool').value = '';
  document.getElementById('fWA').value = '';
  document.getElementById('fGrade').value = '7';
  document.getElementById('modal').classList.add('show');
}

function openEdit(id) {
  const data = getData();
  const s = data.find(d => d.id === id);
  if (!s) return;
  editId = id;
  document.getElementById('modalTitle').textContent = 'Edit Remaja';
  document.getElementById('fName').value = s.name || '';
  document.getElementById('fBirthPlace').value = s.birthPlace || '';
  document.getElementById('fBirthDate').value = s.birthDate || '';
  document.getElementById('fSchool').value = s.school || '';
  document.getElementById('fWA').value = s.wa || '';
  document.getElementById('fGrade').value = s.grade || '7';
  document.getElementById('modal').classList.add('show');
}

function saveStudent() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { alert('Nama harus diisi!'); return; }

  const data = getData();
  const entry = {
    name: name,
    birthPlace: document.getElementById('fBirthPlace').value.trim(),
    birthDate: document.getElementById('fBirthDate').value,
    school: document.getElementById('fSchool').value.trim(),
    wa: document.getElementById('fWA').value.trim(),
    grade: document.getElementById('fGrade').value,
    updatedAt: new Date().toISOString()
  };

  if (editId) {
    const idx = data.findIndex(d => d.id === editId);
    if (idx >= 0) {
      data[idx] = { ...data[idx], ...entry };
    }
  } else {
    entry.id = generateId();
    entry.createdAt = new Date().toISOString();
    data.push(entry);
  }

  saveData(data);
  closeModal();
  renderList();
}

function deleteStudent(id) {
  if (!confirm('Yakin mau hapus data ini?')) return;
  const data = getData().filter(s => s.id !== id);
  saveData(data);
  renderList();
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

// Init
renderList();
</script>
</body>
</html>
