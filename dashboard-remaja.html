<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remaja GBI ROCK — Dashboard</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#0f0f1a; --card:#1a1a2e; --card2:#16213e; --primary:#7c3aed; --primary-dim:#6d28d92a; --accent:#f59e0b; --text:#e2e8f0; --muted:#94a3b8; --border:#1e293b; --success:#22c55e; --radius:16px; }
html { font-size:15px; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:80px; }
header { background:linear-gradient(135deg,var(--card),var(--primary)30); padding:20px 16px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50; backdrop-filter:blur(12px); }
header h1 { font-size:1.5rem; font-weight:700; }
header .sub { color:var(--muted); font-size:.8rem; }
.progress-wrap { margin-top:12px; display:flex; align-items:center; gap:12px; }
.progress-bar { flex:1; height:6px; background:var(--border); border-radius:99px; overflow:hidden; }
.progress-bar .fill { height:100%; width:0%; background:linear-gradient(90deg,var(--primary),var(--accent)); border-radius:99px; transition:width .5s ease; }
.progress-wrap .label { font-size:.75rem; color:var(--muted); white-space:nowrap; }

.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:8px 0 12px; z-index:100; }
.bottom-nav button { background:none; border:none; color:var(--muted); font-size:.7rem; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; padding:4px 8px; border-radius:12px; transition:all .2s; }
.bottom-nav button .icon { font-size:1.4rem; }
.bottom-nav button.active { color:var(--primary); background:var(--primary-dim); }

.tab { display:none; padding:16px; }
.tab.active { display:block; }

.filter-bar { display:flex; gap:8px; margin-bottom:16px; }
.filter-bar button { padding:6px 16px; border-radius:99px; border:1px solid var(--border); background:var(--card); color:var(--muted); cursor:pointer; font-size:.8rem; }
.filter-bar button.active { background:var(--primary); color:#fff; border-color:var(--primary); }

.ep-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; cursor:pointer; position:relative; }
.ep-card:hover { border-color:var(--primary); }
.ep-card.current { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.ep-card .badge { display:inline-block; font-size:.65rem; font-weight:600; padding:2px 8px; border-radius:99px; margin-bottom:6px; }
.badge-past { background:var(--border); color:var(--muted); }
.badge-current { background:#f59e0b20; color:var(--accent); border:1px solid var(--accent); }
.badge-upcoming { background:var(--primary-dim); color:var(--primary); }
.ep-card h3 { font-size:1rem; margin:4px 0 6px; }
.ep-card .meta { font-size:.8rem; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap; }
.ep-card .verse-badge { display:inline-block; background:var(--primary-dim); color:var(--primary); padding:2px 10px; border-radius:99px; font-size:.75rem; margin-top:8px; }
.ep-card .series-tag { position:absolute; top:16px; right:16px; font-size:.65rem; color:var(--muted); background:var(--bg); padding:2px 8px; border-radius:99px; }

.sec { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.sec h3 { font-size:.9rem; font-weight:600; margin-bottom:8px; }
.sec p, .sec li { font-size:.85rem; line-height:1.6; }
.sec ul { padding-left:20px; }
.sec .highlight { background:var(--primary-dim); padding:8px 12px; border-radius:8px; border-left:3px solid var(--primary); margin:8px 0; font-size:.85rem; }

.game-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
.game-card h4 { font-size:.9rem; margin-bottom:4px; }
.game-card .tags { display:flex; gap:6px; margin:6px 0 8px; flex-wrap:wrap; }
.game-card .tags span { font-size:.65rem; padding:2px 8px; border-radius:99px; background:var(--border); color:var(--muted); }
.game-card p { font-size:.8rem; color:var(--muted); line-height:1.5; }

.song-chip { display:inline-block; background:var(--card2); padding:4px 12px; border-radius:99px; font-size:.8rem; margin:3px; border:1px solid var(--border); }

.tool-section { margin-bottom:20px; }
.tool-section h3 { font-size:1rem; margin-bottom:8px; }
.chk-item { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--card); border:1px solid var(--border); border-radius:10px; margin-bottom:6px; cursor:pointer; font-size:.85rem; }
.chk-item.done { opacity:.6; text-decoration:line-through; }
.chk-item input[type=checkbox] { accent-color:var(--primary); width:18px; height:18px; }

.tarea { width:100%; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; color:var(--text); font-size:.85rem; resize:vertical; min-height:60px; margin-bottom:8px; }
.tarea:focus { outline:none; border-color:var(--primary); }

.wa-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
.wa-text { font-size:.85rem; line-height:1.6; margin-bottom:8px; padding:8px; background:var(--bg); border-radius:8px; white-space:pre-wrap; }
.wa-actions { display:flex; gap:8px; }
.wa-actions button { padding:8px 16px; border-radius:8px; border:none; cursor:pointer; font-size:.75rem; font-weight:500; }
.btn-copy { background:var(--primary); color:#fff; }
.btn-wa { background:#25d366; color:#fff; }

select { width:100%; padding:10px; border-radius:10px; background:var(--card); color:var(--text); border:1px solid var(--border); font-size:.85rem; margin-bottom:12px; }
input[type=number], input[type=text] { width:100%; padding:10px; border-radius:10px; background:var(--card); color:var(--text); border:1px solid var(--border); font-size:.85rem; margin-bottom:8px; }

.back-btn { background:none; border:none; color:var(--primary); cursor:pointer; font-size:.85rem; margin-bottom:12px; }
.empty { text-align:center; padding:40px; color:var(--muted); font-size:.85rem; }

@media (min-width:600px) { body { max-width:500px; margin:0 auto; } }
@media print { .bottom-nav { display:none !important; } }
</style>
</head>

  {
    id:'Kursi Musik Rohani', title:'Kursi Musik Rohani', type:'Aktif', durasi:'5 menit', prep:'Kursi + musik', desc:'Kursi musik pake lagu rohani. Yang kalah jawab pertanyaan.'
  }];

var C = 1, CE = null, CT = 0;
var SK = 'gbi-rmj';

function gk(k) { try { var s = JSON.parse(localStorage.getItem(SK))||{}; return s[k]; } catch(e) { return null; } }
function sk(k,v) { var s = JSON.parse(localStorage.getItem(SK))||{}; s[k]=v; localStorage.setItem(SK,JSON.stringify(s)); }

function st(t) {
  CT = t;
  document.querySelectorAll('.tab').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('t'+t).classList.add('active');
  document.querySelectorAll('.bottom-nav button').forEach(function(el,i) { el.classList.remove('active'); if(i===t) el.classList.add('active'); });
  if(t===0) rt();
  else if(t===1) rl();
  else if(t===2) rg();
  else if(t===3) { rc(); ps(); rs(); le(); rw(); }
}

function sf(n) {
  C = n;
  var btns = document.querySelectorAll('.filter-bar button');
  btns[0].classList.toggle('active', n===1);
  btns[1].classList.toggle('active', n===0);
  rt();
}

function rt() {
  var fl = document.getElementById('tlist');
  var done = gk('done')||{};
  fl.innerHTML = '';
  var arr = C===0 ? E : E.filter(function(e){ return e.series===C; });
  if(arr.length===0) { fl.innerHTML = '<div class="empty">Belum ada episode</div>'; return; }
  arr.forEach(function(ep) {
    var sts = 'upcoming', bc = 'badge-upcoming', bt = 'Akan Datang';
    if(done['e'+ep.id]) { sts='past'; bc='badge-past'; bt='✅ Selesai'; }
    var card = document.createElement('div');
    card.className = 'ep-card' + (sts==='current'?' current':'');
    card.onclick = function(){ ol(ep.id); };
    card.innerHTML = '<span class="badge '+bc+'">'+bt+'</span><span class="series-tag">S'+ep.series+'.E'+ep.week+'</span><h3>'+ep.title+'</h3><div class="meta"><span>📅 '+ep.date+'</span></div>'+(ep.verse!==' -'?'<span class="verse-badge">📖 '+ep.verse+'</span>':'');
    fl.appendChild(card);
  });
  var dc = arr.filter(function(e){ return done['e'+e.id]; }).length;
  document.getElementById('pbar').style.width = (arr.length>0?(dc/arr.length*100):0)+'%';
  document.getElementById('plabel').textContent = dc+'/'+arr.length;
}

function ol(id) {
  CE = E.find(function(e){ return e.id===id; });
  st(1);
}

function rl() {
  var el = document.getElementById('lcont');
  if(!CE) { el.innerHTML = '<div class="empty">Pilih episode dari Timeline 📅</div>'; return; }
  var ep = CE;
  var pts = ep.lessonPoints.map(function(p){ return '<li>'+p+'</li>'; }).join('');
  var disc = ep.discussion.length>0 ? '<div class="sec"><h3>💬 Diskusi (5 menit)</h3><ol style="padding-left:20px">'+ep.discussion.map(function(q){ return '<li style="margin-bottom:4px;font-size:.85rem">'+q+'</li>'; }).join('')+'</ol></div>' : '';
  var songs = ep.songs.map(function(s){ return '<span class="song-chip">'+s+'</span>'; }).join(' ');
  el.innerHTML = '<div class="sec"><h3>📌 '+ep.title+'</h3><p>📅 '+ep.date+' • S'+ep.series+'.E'+ep.week+'</p>'+(ep.verse!==' -'?'<p style="margin-top:6px">📖 <strong>'+ep.verse+'</strong></p>':'')+'<div class="highlight">'+ep.keyMessage+'</div></div><div class="sec"><h3>🎬 Hook (2-3 menit)</h3><p>'+ep.hook+'</p></div><div class="sec"><h3>📖 Isi Firman (8-10 menit)</h3><ul>'+pts+'</ul></div>'+disc+'<div class="sec"><h3>✋ Aplikasi</h3><p>'+ep.application+'</p></div><div class="sec"><h3>🙏 Doa</h3><ul>'+ep.prayerPoints.map(function(p){return '<li>'+p+'</li>';}).join('')+'</ul></div><div class="sec"><h3>🎮 Aktivitas</h3><p>'+ep.activity+'</p></div><div class="sec"><h3>📦 Persiapan</h3><ul>'+ep.prep.map(function(p){return '<li>'+p+'</li>';}).join('')+'</ul></div><div class="sec"><h3>🎵 Lagu</h3><p>'+songs+'</p></div><div class="sec" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn-copy" onclick="md('+ep.id+')" style="padding:10px 20px;border:none;border-radius:10px;cursor:pointer;background:var(--primary);color:#fff;font-size:.85rem">✅ Tandai Selesai</button></div>';
}

function md(id) {
  var done = gk('done')||{};
  done['e'+id] = true;
  sk('done', done);
  rt();
  if(CE && CE.id===id) rl();
}

function rg() {
  var q = document.getElementById('gsearch').value.toLowerCase();
  var el = document.getElementById('glist');
  el.innerHTML = '';
  var arr = G.filter(function(g){ return g.title.toLowerCase().indexOf(q)>=0 || g.type.toLowerCase().indexOf(q)>=0 || g.desc.toLowerCase().indexOf(q)>=0; });
  if(arr.length===0) { el.innerHTML = '<div class="empty">Games gak ditemukan</div>'; return; }
  arr.forEach(function(g) {
    el.innerHTML += '<div class="game-card"><h4>🎯 '+g.title+'</h4><div class="tags"><span>'+g.type+'</span><span>⏱ '+g.durasi+'</span><span>📦 '+g.prep+'</span></div><p>'+g.desc+'</p></div>';
  });
}

function ps() {
  ['selsong','seleval','selwa'].forEach(function(id) {
    var sel = document.getElementById(id);
    sel.innerHTML = '';
    E.forEach(function(e) { sel.innerHTML += '<option value="'+e.id+'">S'+e.series+'.E'+e.week+' — '+e.title+'</option>'; });
  });
}

function rs() {
  var id = parseInt(document.getElementById('selsong').value);
  var ep = E.find(function(e){ return e.id===id; });
  if(!ep) { document.getElementById('slist').innerHTML = '<div class="empty">Pilih episode</div>'; return; }
  document.getElementById('slist').innerHTML = '<div class="sec"><h3>🎵 '+ep.title+'</h3><p>'+ep.songs.map(function(s){return '<span class="song-chip">'+s+'</span>';}).join(' ')+'</p></div>';
}

function le() {
  var id = parseInt(document.getElementById('seleval').value);
  var saved = gk('e'+id)||{rating:0,note:'',kids:0,newKids:0,followUp:''};
  var el = document.getElementById('eform');
  el.innerHTML = '<div class="tool-section"><p style="font-size:.85rem">Jumlah anak:</p><input type="number" id="ekids" value="'+saved.kids+'" onchange="se('+id+')"></div><div class="tool-section"><p style="font-size:.85rem">Anak baru:</p><input type="number" id="enew" value="'+saved.newKids+'" onchange="se('+id+')"></div><div class="tool-section"><p style="font-size:.85rem">Rating:</p><div id="stars">'+[1,2,3,4,5].map(function(n){return '<span style="font-size:1.5rem;cursor:pointer;opacity:'+(n<=saved.rating?'1':'.3')+'" onclick="re('+id+','+n+')">⭐</span>';}).join('')+'</div></div><div class="tool-section"><p style="font-size:.85rem">Follow-up:</p><textarea class="tarea" id="efollow" onchange="se('+id+')">'+(saved.followUp||'')+'</textarea></div><div class="tool-section"><p style="font-size:.85rem">Catatan:</p><textarea class="tarea" id="enote" onchange="se('+id+')" rows="3">'+(saved.note||'')+'</textarea></div>';
}

function se(id) {
  var s = gk('e'+id)||{};
  s.kids = document.getElementById('ekids')?.value||0;
  s.newKids = document.getElementById('enew')?.value||0;
  s.followUp = document.getElementById('efollow')?.value||'';
  s.note = document.getElementById('enote')?.value||'';
  sk('e'+id, s);
}

function re(id,n) {
  var s = gk('e'+id)||{};
  s.rating = n;
  sk('e'+id, s);
  le();
}

function rw() {
  var id = parseInt(document.getElementById('selwa').value);
  var ep = E.find(function(e){ return e.id===id; });
  if(!ep) { document.getElementById('wcont').innerHTML = '<div class="empty">Pilih episode</div>'; return; }
  document.getElementById('wcont').innerHTML = '<div class="wa-card"><div class="wa-text">'+ep.waText+'</div><div class="wa-actions"><button class="btn-copy" onclick="cw('+id+')">📋 Copy</button><button class="btn-wa" onclick="ow('+id+')">📱 Buka WA</button></div></div>';
}

function cw(id) {
  var ep = E.find(function(e){ return e.id===id; });
  if(!ep) return;
  navigator.clipboard.writeText(ep.waText);
}

function ow(id) {
  var ep = E.find(function(e){ return e.id===id; });
  if(!ep) return;
  window.open('https://wa.me/?text='+encodeURIComponent(ep.waText), '_blank');
}

function rc() {
  var items = ['Makanan ringan & minuman','LCD / Proyektor siap','Slide ayat & materi','Sound system & mic','Worksheet / kertas aktivitas (print)','Backing track / playlist worship','Alat games (sesuai episode)','Absen kehadiran','Hadiah kecil (kalo ada games)','Kebersihan ruangan setelah ibadah'];
  var checked = gk('chk')||[];
  var el = document.getElementById('chklist');
  el.innerHTML = '';
  items.forEach(function(item, i) {
    var d = document.createElement('div');
    d.className = 'chk-item' + (checked.indexOf(i)>=0?' done':'');
    d.innerHTML = '<input type="checkbox"'+(checked.indexOf(i)>=0?' checked':'')+' onchange="tc('+i+')"> '+item;
    el.appendChild(d);
  });
}

function tc(i) {
  var c = gk('chk')||[];
  var idx = c.indexOf(i);
  if(idx>=0) c.splice(idx,1); else c.push(i);
  sk('chk',c);
  rc();
}

rt();
</script>
</body>
</html>
